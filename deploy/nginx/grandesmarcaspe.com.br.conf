# GMPE Site — HTTPS produção (SSR). Aplicar após certbot-prod-site.sh

# HTTP → HTTPS (apex e www)
server {
  listen 80;
  listen [::]:80;
  server_name grandesmarcaspe.com.br www.grandesmarcaspe.com.br;
  return 301 https://www.grandesmarcaspe.com.br$request_uri;
}

# Apex HTTPS → www
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name grandesmarcaspe.com.br;

  ssl_certificate     /etc/letsencrypt/live/grandesmarcaspe.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/grandesmarcaspe.com.br/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://www.grandesmarcaspe.com.br$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.grandesmarcaspe.com.br;

  ssl_certificate     /etc/letsencrypt/live/grandesmarcaspe.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/grandesmarcaspe.com.br/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  server_tokens off;
  client_max_body_size 12M;
  client_body_timeout 12s;
  client_header_timeout 12s;

  root /var/www/gmpe-site/dist/grandesmarcaspe-site/browser;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 256;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff2;

  location = /favicon.ico {
    access_log off;
    log_not_found off;
    try_files $uri @ssr;
  }

  # Imagens de clientes ficam na API (/var/www/gmpe-api/clientes), não no build.
  # ^~ impede que o location de extensões (try_files no browser/) responda 404.
  location ^~ /clientes/ {
    limit_req zone=gmpe_site burst=60 nodelay;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log off;
  }

  location ~* \.(?:js|css|mjs|map|woff2?|ttf|eot|ico|webp|png|jpe?g|gif|svg)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log off;
  }

  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  location / {
    limit_req zone=gmpe_site burst=40 nodelay;
    limit_req_status 429;
    try_files $uri @ssr;
  }

  location @ssr {
    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_redirect off;

    proxy_connect_timeout 5s;
    proxy_send_timeout 35s;
    proxy_read_timeout 35s;

    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
  }
}
