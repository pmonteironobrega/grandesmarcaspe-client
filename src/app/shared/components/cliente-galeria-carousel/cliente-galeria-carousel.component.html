<section class="cliente-galeria" aria-label="Galeria de fotos">
  <div class="cliente-galeria__viewport">
    <div class="cliente-galeria__track" #track (scroll)="onTrackScroll()">
      @for (slide of slides(); track slide.id; let first = $first) {
        <div class="cliente-galeria__slide">
          <img
            [src]="slide.url"
            [alt]="slide.alt"
            [attr.loading]="first ? 'eager' : 'lazy'"
            [attr.fetchpriority]="first ? 'high' : 'low'"
            width="960"
            height="280"
            (error)="onImageError($event)"
          >
        </div>
      }
    </div>

    @if (slides().length > 1) {
      <button
        type="button"
        class="cliente-galeria__nav cliente-galeria__nav--prev"
        aria-label="Foto anterior"
        (click)="scrollBy(-1)"
      >«</button>
      <button
        type="button"
        class="cliente-galeria__nav cliente-galeria__nav--next"
        aria-label="Próxima foto"
        (click)="scrollBy(1)"
      >»</button>
    }
  </div>

  @if (slides().length > 1) {
    <div class="cliente-galeria__dots">
      @for (slide of slides(); track slide.id; let i = $index) {
        <button
          type="button"
          class="cliente-galeria__dot"
          [class.is-active]="activeIndex() === i"
          [attr.aria-label]="'Foto ' + (i + 1)"
          [attr.aria-current]="activeIndex() === i ? 'true' : null"
          (click)="scrollTo(i)"
        ></button>
      }
    </div>
  }
</section>
