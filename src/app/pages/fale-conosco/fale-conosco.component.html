<app-breadcrumb [config]="configPage"></app-breadcrumb>

<div class="container py-5">
  <div class="row">
    <div class="col-12">
      <h2>Fale Conosco</h2>
    </div>

    <div class="col-lg-8 py-4">
      <form action="">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="nome">Nome</label>
              <input id="nome" type="text" class="form-control">
            </div>

            <div class="form-group">
              <label for="fone">Fone</label>
              <select id="fone" class="form-control">
                <option value="">Selecione</option>
              </select>
            </div>

            <div class="form-group">
              <label for="email">E-mail</label>
              <input id="email" type="text" class="form-control">
            </div>
          </div>

          <div class="col-md-6">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" cols="30" rows="7" class="form-control"></textarea>

            <div class="col-12 mt-3 px-0">
              <button class="btn btn-primary float-right" type="button">Enviar Mensagem</button>
            </div>
          </div>
        </div>
      </form>
    </div>

    <div class="col-lg-4 py-5">
      <div class="row section-address align-items-center">
        <div class="col-auto mt-2">
          <img src="/img/icon-address.svg" alt="" class="w-100 ico-address">
        </div>

        <div class="col align-self-center">
          <p class="cl-cz">Av. Rui barbosa, 3004 - Madalena - Recife/PE CEP: 55600-009</p>
        </div>
      </div>

      <div class="row section-address align-items-center">
        <div class="col-auto mt-2">
          <img src="/img/icon-phone.svg" alt="" class="w-100 ico-address">
        </div>

        <div class="col align-self-center">
          <p class="cl-cz">Fone: (81) 3443.1212</p>
        </div>
      </div>
    </div>
  </div>
</div>

<app-anuncie></app-anuncie>

<app-categorias-populares></app-categorias-populares>
