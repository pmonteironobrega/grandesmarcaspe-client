<app-breadcrumb [config]="breadcrumb"></app-breadcrumb>

<div class="container py-5 auth-page">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="auth-card">
        <h2 class="auth-card__title">Entrar na plataforma</h2>

        <p class="auth-card__subtitle">
          Acesse com sua conta para interagir com o catálogo.
        </p>

        @if (errorMessage()) {
          <app-ui-alert type="error" [autoDismissMs]="0">
            {{ errorMessage() }}
          </app-ui-alert>
        }

        <form (ngSubmit)="submit()" novalidate>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input
              id="email"
              type="email"
              class="form-control input-gm"
              name="email"
              [(ngModel)]="email"
              autocomplete="email"
              required>
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <input
              id="senha"
              type="password"
              class="form-control input-gm"
              name="senha"
              [(ngModel)]="senha"
              autocomplete="current-password"
              required>
          </div>

          <button
            type="submit"
            class="btn btn-lg btn-gradient w-100 auth-card__submit"
            [disabled]="loading()">
            @if (loading()) {
              Aguarde...
            } @else {
              Entrar
            }
          </button>
        </form>

        <div class="auth-card__divider" aria-hidden="true">
          <span>ou</span>
        </div>

        <button
          type="button"
          class="btn btn-lg btn-wt w-100 auth-card__google"
          (click)="loginWithGoogle()"
          [disabled]="loading()">
          <img src="/img/social/google.svg" alt="" class="auth-card__google-icon" aria-hidden="true">
          Continuar com Google
        </button>

        <p class="auth-card__switch">
          Ainda não tem conta?
          <a [routerLink]="['/cadastro']" [queryParams]="authQueryParams()">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>
</div>
