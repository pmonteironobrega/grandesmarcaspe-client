<section class="section-acessados pt-5 pb-5">

  <div class="container">

    <div class="row">

      <div class="col">

        <h3 class="cl-bc font-weight-bold pb-3">Mais Acessados</h3>

      </div>

    </div>



    @if (loading()) {

      <div class="row">

        @for (item of [1, 2, 3, 4, 5, 6]; track item) {

          <div class="col-sm-4 col-xs-12">

            <div class="empreendimento-skeleton card-rounded mb-3"></div>

          </div>

        }

      </div>

    } @else {

      <div class="row">

        @for (cliente of clientes() ?? []; track cliente.id) {

          <div class="col-sm-4 col-xs-12">

            <app-empreendimento [cliente]="cliente"></app-empreendimento>

          </div>

        } @empty {

          <div class="col">

            <p class="cl-cz">Nenhum destaque disponível no momento.</p>

          </div>

        }

      </div>

    }

  </div>

</section>



<app-categorias-populares></app-categorias-populares>

<app-anuncie></app-anuncie>
