<app-breadcrumb [config]="breadcrumb"></app-breadcrumb>

<div class="container py-5 auth-page">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="auth-card">
        <h2 class="auth-card__title">Criar conta</h2>

        <p class="auth-card__subtitle">
          Cadastre-se para interagir com o catálogo. Usuários cadastrados não possuem acesso administrativo.
        </p>

        @if (errorMessage()) {
          <app-ui-alert type="error" [autoDismissMs]="0">
            {{ errorMessage() }}
          </app-ui-alert>
        }

        <form (ngSubmit)="submit()" novalidate>
          <div class="form-group">
            <label for="nome">Nome</label>
            <input
              id="nome"
              type="text"
              class="form-control input-gm"
              name="nome"
              [(ngModel)]="nome"
              autocomplete="name"
              required>
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input
              id="email"
              type="email"
              class="form-control input-gm"
              name="email"
              [(ngModel)]="email"
              autocomplete="email"
              required>
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <input
              id="senha"
              type="password"
              class="form-control input-gm"
              name="senha"
              [(ngModel)]="senha"
              autocomplete="new-password"
              required>
          </div>

          <div class="form-group">
            <label for="confirmarSenha">Confirmar senha</label>
            <input
              id="confirmarSenha"
              type="password"
              class="form-control input-gm"
              name="confirmarSenha"
              [(ngModel)]="confirmarSenha"
              autocomplete="new-password"
              required>
          </div>

          <button
            type="submit"
            class="btn btn-lg btn-gradient w-100 auth-card__submit"
            [disabled]="loading()">
            @if (loading()) {
              Aguarde...
            } @else {
              Criar conta
            }
          </button>
        </form>

        <p class="auth-card__switch">
          Já tem conta?
          <a [routerLink]="['/login']" [queryParams]="authQueryParams()">Entrar</a>
        </p>
      </div>
    </div>
  </div>
</div>
