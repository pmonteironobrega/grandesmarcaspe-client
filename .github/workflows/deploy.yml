name: Deploy Frontend to Locaweb

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      API_INTERNAL_URL: ${{ secrets.API_INTERNAL_URL || 'http://127.0.0.1:3001' }}
      ASSETS_BASE_URL: ${{ secrets.ASSETS_BASE_URL || 'https://api.catalog.pmonteirodev.com.br' }}
      SITE_DOMAIN: ${{ secrets.SITE_DOMAIN || 'catalog.pmonteirodev.com.br' }}
      SSR_PORT: ${{ secrets.SSR_PORT || '4001' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Generate environment.prod.ts
        run: |
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            apiUrl: '${API_INTERNAL_URL}',
            assetsBaseUrl: '${ASSETS_BASE_URL}',
            defaultUf: 'pe',
          };
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'unimportant'
          if_key_exists: replace

      - name: Adding Known Hosts
        run: ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure directories on server
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ${{ secrets.SSH_TARGET }}/environments"

      - name: Write .env.production for PM2/SSR
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cat > ${{ secrets.SSH_TARGET }}/environments/.env.production << EOF
          NODE_ENV=production
          PORT=${SSR_PORT}
          API_URL=${API_INTERNAL_URL}
          NG_ALLOWED_HOSTS=${SITE_DOMAIN}
          SSR_CACHE_TTL=300
          EOF"

      - name: Secure env file permissions
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "chmod 600 ${{ secrets.SSH_TARGET }}/environments/.env.production"

      - name: Deploy with rsync
        run: |
          rsync -avz \
            --exclude environments/.env.production \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            ./dist ./package.json ./package-lock.json ./ecosystem.config.cjs ./deploy/nginx \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET }}

      - name: Install prod deps and restart SSR
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.SSH_TARGET }} && npm ci --omit=dev && \
            if pm2 describe catalog-site > /dev/null 2>&1; then \
              pm2 restart catalog-site --update-env; \
            else \
              pm2 start ecosystem.config.cjs --env production; \
            fi && pm2 save"

      - name: Fix permissions for nginx
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "chown -R www-data:www-data ${{ secrets.SSH_TARGET }}/dist/grandesmarcaspe-site/browser 2>/dev/null || true"
